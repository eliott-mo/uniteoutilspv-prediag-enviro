# Référentiels figés. On ne tape JAMAIS une API en direct pendant une étude :
# on télécharge, on épingle la version, et chaque sortie porte la version utilisée.
#
# Licence : Licence Ouverte / Open Licence (Etalab) — réutilisation commerciale
# autorisée sous réserve de citer la source ET sa date de mise à jour.
# Source : Muséum national d'Histoire naturelle / PatriNat (OFB-MNHN-CNRS-IRD)
# https://inpn.mnhn.fr/referentiels-donnees

attribution: "Muséum national d'Histoire naturelle / PatriNat (OFB-MNHN-CNRS-IRD)"
page_source: "https://inpn.mnhn.fr/referentiels-donnees"

referentiels:
  taxref:
    version: "18"
    url: "https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip"
    fichier: "TAXREF.zip"
    membres:
      principal: "TAXREFv18.txt"
      vernaculaires: "TAXVERNv18.txt"
      disparus: "CDNOM_DISPARUS.txt"
      changements: "TAXREF_CHANGES.txt"

  bdc_statuts:
    version: "18"
    url: "https://assets.patrinat.fr/files/referentiel/BDC.zip"
    fichier: "BDC.zip"
    membres:
      principal: "BDC_18/bdc_18_01.csv"
      types: "BDC_18/BDC_STATUTS_TYPES_18.csv"

  # ── Zonages du patrimoine naturel ────────────────────────────────────────
  # Alimentent les tableaux 8 à 10 de l'état initial et leurs cartes. Volumineux
  # mais téléchargés une fois : une étude se fait alors sans réseau, et les
  # WFS qui tombent ne bloquent plus personne.
  znieff:
    version: "06/2025"
    url: "https://assets.patrinat.fr/files/donnees/znieff/ZNIEFF.zip"
    fichier: "ZNIEFF.zip"

  natura2000:
    version: "12/2024"
    url: "https://assets.patrinat.fr/files/donnees/natura2000/NATURA2000.zip"
    fichier: "NATURA2000.zip"

  espaces_proteges:
    version: "07/2026"
    url: "https://assets.patrinat.fr/files/donnees/ep/EP.zip"
    fichier: "EP.zip"

  patrimoine_geologique:
    version: "07/2025"
    url: "https://assets.patrinat.fr/files/donnees/inpg/INPG.zip"
    fichier: "INPG.zip"

  # Deux couches que les archives de l'INPN ne portent pas, servies par son
  # flux WFS. On les fige une fois, comme les archives, plutôt que d'interroger
  # le flux à chaque prédiagnostic : l'outil doit tourner hors ligne, et la
  # Licence Ouverte impose de citer une source AVEC sa date. Un flux n'a pas
  # de version publiée — `version` reste vide et la date de récupération en
  # tient lieu.
  #
  # Pour rafraîchir : supprimer l'archive locale et relancer. Ces couches
  # bougent, l'INPN annonce lui-même celle des ENS « en construction ».
  ens:
    version: ""
    url: "http://ws.carmencarto.fr/WFS/119/fxx_inpn?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ms:Espaces_naturels_sensibles&OUTPUTFORMAT=SHAPE"
    fichier: "ENS.zip"

  zico:
    version: ""
    url: "http://ws.carmencarto.fr/WFS/119/fxx_inpn?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ms:ZICO&OUTPUTFORMAT=SHAPE"
    fichier: "ZICO.zip"
